<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>King's Gambit — 3D Chess</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Pro:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root { --gold:#c9a227; --ink:#e8dcc4; }
  * { box-sizing:border-box }
  html,body { margin:0; height:100%; overflow:hidden; background:#14100c;
              font-family:'Crimson Pro',Georgia,serif; color:var(--ink) }
  canvas { display:block }

  #boot { position:fixed; inset:0; display:grid; place-items:center; z-index:9;
          background:#14100c; letter-spacing:.3em; text-transform:uppercase; font-size:12px }

  header { position:fixed; top:0; left:0; right:0; padding:14px 0 0; text-align:center;
           pointer-events:none; z-index:5 }
  h1 { font-family:'Cinzel',serif; font-weight:600; font-size:26px; margin:0; letter-spacing:.14em;
       color:#f0e4c8; text-shadow:0 2px 18px rgba(0,0,0,.8) }
  header small { display:block; letter-spacing:.34em; font-size:9px; opacity:.5;
                 text-transform:uppercase; margin-bottom:3px }

  #hud { position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:5;
         display:flex; gap:8px; align-items:center;
         background:rgba(20,16,12,.82); border:1px solid rgba(201,162,39,.28);
         border-radius:10px; padding:9px 13px; backdrop-filter:blur(9px) }
  #status { font-style:italic; min-width:132px; font-size:14px }
  .sep { width:1px; height:20px; background:rgba(201,162,39,.25) }
  button { font-family:'Cinzel',serif; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
           background:transparent; color:var(--ink); border:1px solid rgba(201,162,39,.3);
           border-radius:6px; padding:6px 10px; cursor:pointer; transition:.15s }
  button:hover { border-color:var(--gold); color:#fff }
  button.on { background:var(--gold); border-color:var(--gold); color:#14100c }

  #captured { position:fixed; top:66px; left:50%; transform:translateX(-50%); z-index:5;
              font-size:21px; line-height:1; letter-spacing:1px; text-shadow:0 1px 6px #000 }
  .ivory { color:#f2ece0 } .obsidian { color:#6d6459 }

  #meta { position:fixed; right:14px; bottom:16px; z-index:5; font-size:11px; opacity:.42;
          text-align:right; letter-spacing:.06em }
  @media (max-width:560px){ #hud{flex-wrap:wrap;justify-content:center;max-width:94vw} #meta{display:none} }
</style>

<div id="boot">loading</div>

<header>
  <small>Anno Domini MCDXCII</small>
  <h1>KING'S GAMBIT</h1>
</header>

<div id="captured"></div>

<div id="hud">
  <span id="status">…</span>
  <span class="sep"></span>
  <button data-depth="2">Squire</button>
  <button data-depth="3" class="on">Knight</button>
  <button data-depth="4">Master</button>
  <span class="sep"></span>
  <button id="undo">Undo</button>
  <button id="restart">New</button>
</div>

<div id="meta">move <span id="movecount">0</span> · drag to orbit</div>

<script type="importmap">{"imports":{
  "three":"https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"
}}</script>
<script type="module" src="./main.js?v=5"></script>
